<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sidebar">
        <div class="logo">Oasis<span>Care</span></div>
        <a href="index.html" class="nav-link active">Dashboard</a>
        <a href="patients.html" class="nav-link">Manage Patients</a>
        <a href="doctors.html" class="nav-link">Our Doctors</a>
        <a href="appointments.html" class="nav-link">Appointments</a>
    </div>
    
    <div class="main-content">
        <header>
            <h1>Overview Dashboard</h1>
            <p>Welcome back to the administrator portal.</p>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <p>Total Patients</p>
                <h3 id="patientCount">-</h3>
            </div>
            <div class="stat-card">
                <p>Total Doctors</p>
                <h3 id="doctorCount">-</h3>
            </div>
            <div class="stat-card">
                <p>Active Appointments</p>
                <h3 id="apptCount">-</h3>
            </div>
        </div>

        <div class="card" style="margin-top: 2rem;">
            <h2>Quick Doctor Search</h2>
            <input type="text" id="filterDocs" style="width:100%; padding:0.8rem; background:rgba(0,0,0,0.2); border:1px solid rgba(255,255,255,0.1); border-radius:8px; color:white; outline:none; margin-top:1rem;" placeholder="🔍 Locate a doctor by name or specialization..." onkeyup="filterDoctors()">
            <div id="doctorSearchResults" style="display:none; background:rgba(0,0,0,0.2); padding:1rem; border-radius:8px; margin-top:1rem;"></div>
        </div>

        <div class="card" style="margin-top: 2rem;">
            <h2>Recent Appointments</h2>
            <table>
                <thead>
                    <tr>
                        <th>Patient</th>
                        <th>Doctor</th>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="apptsBody">
                    <tr><td colspan="5" style="text-align: center;">Loading from Backend Database...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        let allDocsHome = [];

        function filterDoctors() {
            const term = document.getElementById('filterDocs').value.toLowerCase();
            const resBox = document.getElementById('doctorSearchResults');
            
            if(!term) {
                resBox.style.display = 'none';
                return;
            }
            
            resBox.style.display = 'block';
            const filtered = allDocsHome.filter(d => 
                d.specialization.toLowerCase().includes(term) || d.name.toLowerCase().includes(term)
            );
            
            if(filtered.length === 0) {
                resBox.innerHTML = '<span style="color:var(--text-muted)">No doctors found.</span>';
                return;
            }

            let html = '<ul style="list-style:none;">';
            filtered.forEach(d => {
                html += `<li style="padding:0.5rem 0; border-bottom:1px solid rgba(255,255,255,0.05);"><span style="color:white; font-weight:bold">Dr. ${d.name}</span> <span style="background:rgba(255,255,255,0.1); padding:2px 8px; border-radius:12px; font-size:0.8em; margin-left:10px;">${d.specialization}</span></li>`;
            });
            html += '</ul>';
            resBox.innerHTML = html;
        }

        async function loadDashboard() {
            try {
                const [patients, doctors, appts] = await Promise.all([
                    fetch(`${API_BASE}/patients`).then(r => r.json()),
                    fetch(`${API_BASE}/doctors`).then(r => r.json()),
                    fetch(`${API_BASE}/appointments`).then(r => r.json())
                ]);

                allDocsHome = doctors;

                document.getElementById('patientCount').innerText = patients.length;
                document.getElementById('doctorCount').innerText = doctors.length;
                document.getElementById('apptCount').innerText = appts.length;

                const tbody = document.getElementById('apptsBody');
                tbody.innerHTML = '';
                if(appts.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center;">No appointments found.</td></tr>';
                }
                appts.forEach(a => {
                    tbody.innerHTML += `
                        <tr>
                            <td style="font-weight: bold">${a.patient.name}</td>
                            <td>Dr. ${a.doctor.name}</td>
                            <td>${a.appointmentDate}</td>
                            <td>${a.appointmentTime}</td>
                            <td><span style="color:var(--accent); font-weight: bold">${a.status}</span></td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("Backend not running or CORS issue", err);
                document.getElementById('apptsBody').innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--accent);">Failed to connect to Java Backend. Make sure it is running on Port 8080.</td></tr>';
            }
        }
        loadDashboard();
    </script>
</body>
</html>
