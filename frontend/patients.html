<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Patients</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .search-bar { width: 100%; margin-bottom: 1rem; }
        .action-btn { background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 4px 10px; font-size: 0.8em; margin-right: 5px; }
        .action-btn:hover { background: var(--primary); color: white; }
        .save-btn { border-color: var(--accent); color: var(--accent); }
        .save-btn:hover { background: var(--accent); color: white; }
        td input { padding: 4px; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">Oasis<span>Care</span></div>
        <a href="index.html" class="nav-link">Dashboard</a>
        <a href="patients.html" class="nav-link active">Manage Patients</a>
        <a href="doctors.html" class="nav-link">Our Doctors</a>
        <a href="appointments.html" class="nav-link">Appointments</a>
    </div>
    
    <div class="main-content">
        <header>
            <h1>Manage Patients</h1>
            <p>Register, search, and edit patient records.</p>
        </header>

        <div class="card">
            <h2>Register New Patient</h2>
            <form id="patientForm" style="margin-top: 1rem;">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="pName" required placeholder="John Doe">
                </div>
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" id="pAge" required placeholder="32">
                </div>
                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="text" id="pContact" placeholder="555-123-4567">
                </div>
                <div class="form-group">
                    <label>Medical History / Notes</label>
                    <input type="text" id="pHistory" placeholder="e.g. Asthma">
                </div>
                <button type="submit">Submit Record</button>
            </form>
        </div>

        <div class="card">
            <h2>Quick Doctor Locator</h2>
            <input type="text" id="filterDocs" class="search-bar" style="margin-top:1rem;" placeholder="🔍 Find a doctor by name or specialization..." onkeyup="filterDoctors()">
            <div id="doctorSearchResults" style="display:none; background:rgba(0,0,0,0.2); padding:1rem; border-radius:8px;"></div>
        </div>

        <div class="card">
            <h2>Patient Directory</h2>
            <input type="text" id="searchPatients" class="search-bar" placeholder="🔍 Search patients by name..." onkeyup="filterPatients()">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Age</th>
                        <th>Contact</th>
                        <th>History</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="patientsBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        let allPatients = [];
        let allDocsHome = [];

        async function fetchDoctorsForSearch() {
            try {
                const res = await fetch(`${API_BASE}/doctors`);
                allDocsHome = await res.json();
            } catch(e){}
        }
        fetchDoctorsForSearch();
        
        function filterDoctors() {
            const term = document.getElementById('filterDocs').value.toLowerCase();
            const resBox = document.getElementById('doctorSearchResults');
            
            if(!term) {
                resBox.style.display = 'none';
                return;
            }
            
            resBox.style.display = 'block';
            const filtered = allDocsHome.filter(d => 
                d.specialization.toLowerCase().includes(term) || d.name.toLowerCase().includes(term)
            );
            
            if(filtered.length === 0) {
                resBox.innerHTML = '<span style="color:var(--text-muted)">No doctors found.</span>';
                return;
            }

            let html = '<ul style="list-style:none;">';
            filtered.forEach(d => {
                html += `<li style="padding:0.5rem 0; border-bottom:1px solid rgba(255,255,255,0.05);"><span style="color:white; font-weight:bold">Dr. ${d.name}</span> <span style="background:rgba(255,255,255,0.1); padding:2px 8px; border-radius:12px; font-size:0.8em; margin-left:10px;">${d.specialization}</span></li>`;
            });
            html += '</ul>';
            resBox.innerHTML = html;
        }

        document.getElementById('patientForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pt = {
                name: document.getElementById('pName').value,
                age: document.getElementById('pAge').value,
                contactNumber: document.getElementById('pContact').value,
                medicalHistory: document.getElementById('pHistory').value
            };
            await fetch(`${API_BASE}/patients`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(pt)
            });
            e.target.reset();
            loadPatients();
        });

        async function loadPatients() {
            try {
                const res = await fetch(`${API_BASE}/patients`);
                allPatients = await res.json();
                renderTable(allPatients);
            } catch (err) {}
        }

        function renderTable(data) {
            const tbody = document.getElementById('patientsBody');
            tbody.innerHTML = '';
            if(data.length === 0) tbody.innerHTML = '<tr><td colspan="6">No records found.</td></tr>';
            
            data.forEach(p => {
                tbody.innerHTML += `
                    <tr id="row-${p.id}">
                        <td>#${p.id}</td>
                        <td class="p-name" style="font-weight: bold; color: white">${p.name}</td>
                        <td class="p-age">${p.age}</td>
                        <td class="p-contact">${p.contactNumber}</td>
                        <td class="p-history" style="color: var(--text-muted)">${p.medicalHistory}</td>
                        <td>
                            <button class="action-btn" onclick="editRow(${p.id})">Edit</button>
                        </td>
                    </tr>
                `;
            });
        }

        function filterPatients() {
            const term = document.getElementById('searchPatients').value.toLowerCase();
            const filtered = allPatients.filter(p => p.name.toLowerCase().includes(term));
            renderTable(filtered);
        }

        function editRow(id) {
            const row = document.getElementById(`row-${id}`);
            const name = row.querySelector('.p-name').innerText;
            const age = row.querySelector('.p-age').innerText;
            const contact = row.querySelector('.p-contact').innerText;
            const history = row.querySelector('.p-history').innerText;

            row.innerHTML = `
                <td>#${id}</td>
                <td><input type="text" id="edit-name-${id}" value="${name}"></td>
                <td><input type="number" id="edit-age-${id}" value="${age}"></td>
                <td><input type="text" id="edit-contact-${id}" value="${contact}"></td>
                <td><input type="text" id="edit-history-${id}" value="${history}"></td>
                <td><button class="action-btn save-btn" onclick="saveRow(${id})">Save</button></td>
            `;
        }

        async function saveRow(id) {
            const updated = {
                name: document.getElementById(`edit-name-${id}`).value,
                age: document.getElementById(`edit-age-${id}`).value,
                contactNumber: document.getElementById(`edit-contact-${id}`).value,
                medicalHistory: document.getElementById(`edit-history-${id}`).value
            };
            await fetch(`${API_BASE}/patients/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updated)
            });
            loadPatients(); // Reload fresh real data from DB
        }

        loadPatients();
    </script>
</body>
</html>
